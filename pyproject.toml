[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "repo-rules"
version = "0.8.0"
description = "Mechanical repository hygiene rules for C++ and Python projects"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Xijian Yan" }]
keywords = ["repository", "hygiene", "lint", "line-endings", "changelog"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

[project.scripts]
repo-rules = "repo_rules:main"

[tool.setuptools]
py-modules = ["repo_rules"]

[tool.setuptools.data-files]
"share/repo-rules/presets" = ["presets/*.json"]
"share/repo-rules/templates/githooks" = ["templates/githooks/pre-commit"]
"share/repo-rules/templates/github/workflows" = ["templates/github/workflows/hygiene.yml"]
