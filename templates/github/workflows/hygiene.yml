# Repository rules that do not need a compiler.
#
# Generated by `repo-rules init`; adjust the checker version/path if needed.
# Keep this workflow in addition to the project's build CI: documentation and
# configuration changes must still run the repository rules.

name: hygiene

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

permissions:
  contents: read

concurrency:
  group: hygiene-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repo-rules:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Check repository rules
        run: python3 scripts/repo_rules.py check --config repo-rules.json
